<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<!-- added small link to return to homepage -->
<p style="position:fixed; top:12px; left:12px; margin:0; z-index:60;">
	<a href="index.html" style="text-decoration:none;color:#111;background:#fff;padding:6px 10px;border-radius:6px;border:1px solid rgba(0,0,0,0.06);font-weight:600;">← Home</a>
</p>

<div class="container">
    <div class="login-box">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue</p>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="email" placeholder="Email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="footer-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
